name: Deploy MkDocs to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r requirements-docs.lock
          python -m pip check

      - name: Configure canonical TokenPak identity
        run: |
          git config user.name TokenPak
          git config user.email hello@tokenpak.ai

      - name: Verify site CTA targets exist in built docs
        run: |
          mkdocs build --strict --site-dir /tmp/site-check
          for p in QUICKSTART installation quickstart install cli cli-reference \
                   architecture troubleshooting \
                   guides/aider guides/anthropic-sdk guides/claude-code guides/cline \
                   guides/codex guides/continue guides/cursor guides/gemini-cli guides/openai-sdk; do
            test -f "/tmp/site-check/$p/index.html" || { echo "Missing /$p/ page"; exit 1; }
          done

      - name: Build + deploy to gh-pages
        run: |
          mkdocs gh-deploy --force --message "Deployed {sha} with MkDocs version: {version}"
