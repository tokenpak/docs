info:
  title: TokenPak Proxy API
  version: "1.22.0"
  description: |
    TokenPak is a drop-in HTTP proxy that sits between your app and LLM APIs.
    It compresses requests, deduplicates cache hits, and tracks token spend —
    with zero SDK changes required.

    ## Usage

    Point your LLM client at `http://localhost:8766` instead of the provider endpoint:

    ```bash
    ANTHROPIC_BASE_URL=http://localhost:8766 claude-code ...
    OPENAI_BASE_URL=http://localhost:8766/v1 openai ...
    ```

    ## Authentication

    Localhost requests require no proxy credential. A non-localhost listener
    requires `TOKENPAK_PROXY_AUTH_TOKEN` on the server and the matching
    `Authorization: Bearer` credential from the client; TokenPak strips that
    client-to-proxy credential before forwarding. Provider authentication is
    separate and may come from server-side credentials, `x-api-key`, or an
    already-authenticated client session.

  contact:
    name: TokenPak
    url: https://github.com/tokenpak/tokenpak
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8766
    description: Local proxy (default port)

# Localhost requests are trusted. A client reaching a non-localhost listener
# must use the Bearer scheme below, so both security alternatives are valid.
security:
  - {}
  - ProxyBearerAuth: []

tags:
  - name: passthrough
    description: LLM API passthrough (forwarded to upstream providers)
  - name: health
    description: Proxy health and readiness
  - name: stats
    description: Request and token usage statistics
  - name: traces
    description: Per-request pipeline trace inspection
  - name: cache
    description: Cache statistics and management
  - name: vault
    description: Vault index diagnostics
  - name: metrics
    description: Prometheus and dashboard metrics
  - name: ingest
    description: Document ingestion into vault context
  - name: degradation
    description: Circuit breaker and degradation state

paths:

  # ─── LLM Passthrough ──────────────────────────────────────────────────────

  /v1/messages:
    post:
      operationId: createMessage
      summary: Anthropic Messages API (passthrough)
      description: |
        Drop-in replacement for the Anthropic `/v1/messages` endpoint.
        TokenPak compresses the context before forwarding, then returns the
        upstream response unchanged.
      tags: [passthrough]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessagesRequest"
            example:
              model: claude-sonnet-4-6
              max_tokens: 1024
              messages:
                - role: user
                  content: Hello, world!
      responses:
        "200":
          description: Upstream Anthropic response (unmodified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicMessagesResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /v1/messages/session-economics:
    post:
      operationId: getSessionEconomics
      summary: Session economics from the local ledger
      description: |
        Builds the immutable `session-economics/1` response from completed
        local request-ledger rows. Missing measurements remain explicitly
        unavailable rather than being coerced to zero. No upstream API call is
        made.

        Supply a stable session id in `X-Claude-Code-Session-Id` or in the
        request body. If both are supplied, they must match.

        If neither is supplied, v1.22.0 resolves a default session: an
        explicit id and the caller's active-session marker are checked
        first, and if neither exists the proxy falls back to the most
        recent session with at least one completed, non-empty ledger row.
        If no defaultable session exists yet, the response reports an
        explicit no-data/unavailable state rather than inventing one.
      tags: [passthrough]
      parameters:
        - name: X-Claude-Code-Session-Id
          in: header
          required: false
          description: Stable session id used to select completed ledger rows.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionEconomicsRequest"
            example:
              session_id: session-abc
              model: claude-sonnet-4-5
      responses:
        "200":
          description: Versioned session economics derived from local facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEconomicsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Local ledger evaluation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI Chat Completions API (passthrough)
      description: |
        Drop-in replacement for the OpenAI `/v1/chat/completions` endpoint.
        Supports streaming (`stream: true`).
      tags: [passthrough]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAIChatRequest"
            example:
              model: gpt-4o
              messages:
                - role: user
                  content: What is the capital of France?
      responses:
        "200":
          description: OpenAI chat completion response (unmodified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIChatResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "502":
          $ref: "#/components/responses/UpstreamError"

  # ─── Health ───────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: getHealth
      summary: Proxy health check
      description: |
        Returns the current uncached basic health envelope. Set `deep=true` to
        add bounded provider, process-memory, and disk diagnostics.
      tags: [health]
      parameters:
        - in: query
          name: deep
          required: false
          schema:
            type: boolean
            default: false
          description: Add bounded diagnostic fields to the basic envelope.
      responses:
        "200":
          description: Proxy is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                uptime_seconds: 3600
                version: 1.22.0
                pid: 4242
                requests_total: 42
                requests_errors: 0
                compression_ratio_avg: 0.44
                is_degraded: false
                is_shutting_down: false
                in_flight_requests: 0
                memory_guard: {}
                admission: {}
                agent_concurrency: {}
                timestamp: "2026-07-24T05:30:00Z"
                connection_pool: {}
                circuit_breakers: {}

  # ─── Stats ────────────────────────────────────────────────────────────────

  /stats:
    get:
      operationId: getStats
      summary: Full session statistics
      description: Returns complete stats including session totals, vault index state, recent requests, and per-model breakdown.
      tags: [stats]
      responses:
        "200":
          description: Full stats object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /stats/last:
    get:
      operationId: getLastRequestStats
      summary: Last request statistics
      description: Returns per-request stats for the most recently processed request.
      tags: [stats]
      responses:
        "200":
          description: Last request stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastRequestStats"
              example:
                request_id: req_abc123
                timestamp: "2026-03-25T09:00:00Z"
                model: claude-sonnet-4-6
                tokens_saved: 420
                percent_saved: 32.1
                cost_saved: 0.0012
                session_total_saved: 0.0452
                session_requests: 14
                input_tokens_raw: 1310
                input_tokens_sent: 890
                output_tokens: 256

  /stats/session:
    get:
      operationId: getSessionStats
      summary: Session aggregate statistics
      description: Returns aggregated stats for the current proxy session.
      tags: [stats]
      responses:
        "200":
          description: Session stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStats"

  # ─── Traces ───────────────────────────────────────────────────────────────

  /traces:
    get:
      operationId: listTraces
      summary: List all pipeline traces
      description: Returns all captured request pipeline traces (compression, injection, routing steps).
      tags: [traces]
      responses:
        "200":
          description: Trace list
          content:
            application/json:
              schema:
                type: object
                properties:
                  traces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trace"
                  count:
                    type: integer

  /trace/last:
    get:
      operationId: getLastTrace
      summary: Last request pipeline trace
      description: Returns the full pipeline trace for the most recently processed request.
      tags: [traces]
      responses:
        "200":
          description: Trace object or not-found error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Trace"
                  - $ref: "#/components/schemas/ErrorResponse"

  /trace/{request_id}:
    get:
      operationId: getTraceById
      summary: Pipeline trace by request ID
      description: Returns the full pipeline trace for a specific request ID.
      tags: [traces]
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
          example: req_abc123
      responses:
        "200":
          description: Trace object or not-found error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Trace"
                  - $ref: "#/components/schemas/ErrorResponse"

  # ─── Cache ────────────────────────────────────────────────────────────────

  /cache-stats:
    get:
      operationId: getCacheStats
      summary: Cache statistics
      description: Returns cache hit/miss counts, token savings, and efficiency metrics.
      tags: [cache]
      responses:
        "200":
          description: Cache statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStats"

  # ─── Metrics ──────────────────────────────────────────────────────────────

  /metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Prometheus metrics
      description: Returns counters and gauges in Prometheus text format (text/plain).
      tags: [metrics]
      responses:
        "200":
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP tokenpak_requests_total Total requests processed
                # TYPE tokenpak_requests_total counter
                tokenpak_requests_total 42

  /metrics/dashboard:
    get:
      operationId: getDashboardMetrics
      summary: Comprehensive dashboard metrics (JSON)
      description: |
        Returns 8 key metrics in a single JSON response suitable for dashboards:
        request count + throughput, latency histogram, model distribution,
        routing decisions, cache hit ratio, error rate, streaming count,
        and 24-hour rolling window stats.
      tags: [metrics]
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"

  # ─── Degradation / Circuit Breakers ───────────────────────────────────────

  /degradation:
    get:
      operationId: getDegradationState
      summary: Degradation and circuit breaker state
      description: Returns whether the proxy is operating in degraded mode and details of any recent degradation events.
      tags: [degradation]
      responses:
        "200":
          description: Degradation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegradationState"

  /circuit-breakers:
    get:
      operationId: getCircuitBreakers
      summary: Circuit breaker status for all providers
      description: Returns enabled state and per-provider circuit breaker open/closed status.
      tags: [degradation]
      responses:
        "200":
          description: Circuit breaker registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitBreakerRegistry"

  # ─── Ingest ───────────────────────────────────────────────────────────────

  /ingest:
    post:
      operationId: acknowledgeIngest
      summary: Acknowledge one compatibility payload
      description: >-
        Accepts one JSON payload and returns a generated record ID. In v1.22.0,
        this compatibility endpoint does not persist or index its contents.
      tags: [ingest]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: Any JSON value; the v1.22.0 handler does not inspect its contents.
            example:
              content: Compatibility payload
      responses:
        "200":
          description: Acknowledgement with one generated ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, ids]
                properties:
                  status:
                    type: string
                    const: ok
                  ids:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: string
                      format: uuid


# ─── Components ─────────────────────────────────────────────────────────────

components:
  securitySchemes:
    ProxyBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Required for clients reaching a non-localhost listener. The value must
        match the server's `TOKENPAK_PROXY_AUTH_TOKEN`. Localhost requests do
        not require this credential, and TokenPak strips it before forwarding.

  schemas:

    # ── LLM passthrough schemas ──────────────────────────────────────────────

    AnthropicMessagesRequest:
      type: object
      required: [model, max_tokens, messages]
      properties:
        model:
          type: string
          example: claude-sonnet-4-6
        max_tokens:
          type: integer
          example: 1024
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        system:
          type: string
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 1
        top_p:
          type: number

    SessionEconomicsRequest:
      type: object
      description: Optional selectors for a completed local session.
      properties:
        session_id:
          type: string
          description: Stable session id; must match the stable session header when both are present.
        model:
          type: string
          description: Optional model hint for ambiguous local ledger data.

    SessionEconomicsResponse:
      type: object
      additionalProperties: true
      description: >-
        Immutable, truth-preserving session-economics/1 response. Consumers
        accept additive fields for forward-compatible v1 evolution.
      required: [schema_version, as_of, session, facts, state, runway, forecast, advisory]
      properties:
        schema_version:
          type: string
          const: session-economics/1
        as_of:
          type: string
          format: date-time
          pattern: '(?:Z|[+-][0-9]{2}(?::?[0-9]{2})?(?::?[0-9]{2}(?:[.,][0-9]+)?)?)$'
        session:
          $ref: "#/components/schemas/SessionEconomicsSession"
        facts:
          $ref: "#/components/schemas/SessionEconomicsFacts"
        state:
          $ref: "#/components/schemas/SessionEconomicsState"
        runway:
          $ref: "#/components/schemas/SessionEconomicsRunway"
        forecast:
          $ref: "#/components/schemas/SessionEconomicsForecast"
        advisory:
          type: "null"
      allOf:
        - if:
            properties:
              state:
                properties:
                  burn_usd_per_turn:
                    properties:
                      state:
                        const: estimated
          then:
            properties:
              facts:
                properties:
                  cost_usd:
                    properties:
                      state:
                        const: estimated
        - if:
            properties:
              state:
                properties:
                  burn_usd_per_turn:
                    properties:
                      state:
                        const: observed
          then:
            properties:
              facts:
                properties:
                  cost_usd:
                    properties:
                      state:
                        const: observed
        - if:
            properties:
              forecast:
                properties:
                  remaining_cost_usd_likely_50:
                    properties:
                      state:
                        const: estimated
          then:
            properties:
              facts:
                properties:
                  cost_usd:
                    properties:
                      state:
                        const: estimated

    SessionEconomicsNumericValue:
      type: object
      additionalProperties: true
      required: [state, value]
      properties:
        state:
          type: string
          enum: [observed, estimated, no_data, unavailable, error]
        value:
          type: [number, "null"]
          minimum: 0
        source:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
        confidence:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
        reason:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
        unit:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
      description: >-
        Observed or estimated values carry a numeric value and source. no_data,
        unavailable, and error carry null; error also carries a reason.
      allOf:
        - if:
            properties:
              state:
                enum: [observed, estimated]
            required: [state]
          then:
            required: [source]
            properties:
              value:
                type: number
              source:
                type: string
                minLength: 1
        - if:
            properties:
              state:
                enum: [no_data, unavailable, error]
            required: [state]
          then:
            properties:
              value:
                type: "null"
        - if:
            properties:
              state:
                const: error
            required: [state]
          then:
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1

    SessionEconomicsTokenFactValue:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsNumericValue"
        - type: object
          properties:
            state:
              type: string
              enum: [observed, no_data, unavailable, error]
            unit:
              type: string
              enum: ["", tokens]

    SessionEconomicsTokenValue:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsNumericValue"
        - type: object
          properties:
            unit:
              type: string
              enum: ["", tokens]

    SessionEconomicsTokensPerTurnValue:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsNumericValue"
        - type: object
          properties:
            unit:
              type: string
              enum: ["", tokens/turn]

    SessionEconomicsUsdPerTurnValue:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsNumericValue"
        - type: object
          properties:
            unit:
              type: string
              enum: ["", usd/turn]

    SessionEconomicsSecondsValue:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsNumericValue"
        - type: object
          properties:
            unit:
              type: string
              enum: ["", seconds]

    SessionEconomicsProbabilityValue:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsNumericValue"
        - type: object
          properties:
            value:
              type: [number, "null"]
              minimum: 0
              maximum: 1
            unit:
              type: string
              enum: ["", probability]

    SessionEconomicsRateProvenance:
      type: object
      additionalProperties: true
      required: [catalog_version, effective_at, source, freshness]
      properties:
        catalog_version:
          type: [string, "null"]
          pattern: *tokenpak-rendering-base
        effective_at:
          type: [string, "null"]
          format: date-time
          pattern: '(?:Z|[+-][0-9]{2}(?::?[0-9]{2})?(?::?[0-9]{2}(?:[.,][0-9]+)?)?)$'
        source:
          type: [string, "null"]
          pattern: *tokenpak-rendering-base
        freshness:
          type: string
          enum: [fresh, stale, unknown]

    SessionEconomicsCostValue:
      type: object
      additionalProperties: true
      required: [state, value, basis, rate_provenance]
      properties:
        state:
          type: string
          enum: [observed, estimated, no_data, unavailable, error]
        value:
          type: [number, "null"]
          minimum: 0
        basis:
          type: string
          enum: [provider_bill, rate_card, subscription, unknown]
        rate_provenance:
          $ref: "#/components/schemas/SessionEconomicsRateProvenance"
        source:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
        reason:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
      description: >-
        observed cost uses provider_bill plus a source. estimated cost uses
        rate_card plus complete fresh rate provenance. Non-value states carry null.
      allOf:
        - if:
            properties:
              state:
                const: observed
            required: [state]
          then:
            required: [source]
            properties:
              value:
                type: number
              basis:
                const: provider_bill
              source:
                type: string
                minLength: 1
        - if:
            properties:
              state:
                const: estimated
            required: [state]
          then:
            properties:
              value:
                type: number
              basis:
                const: rate_card
              rate_provenance:
                required: [catalog_version, effective_at, source, freshness]
                properties:
                  catalog_version:
                    type: string
                    minLength: 1
                  effective_at:
                    type: string
                    format: date-time
                  source:
                    type: string
                    minLength: 1
                  freshness:
                    const: fresh
        - if:
            properties:
              state:
                enum: [no_data, unavailable, error]
            required: [state]
          then:
            properties:
              value:
                type: "null"
        - if:
            properties:
              state:
                const: error
            required: [state]
          then:
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1

    SessionEconomicsModel:
      type: object
      additionalProperties: true
      required: [id, effort]
      properties:
        id:
          type: string
          pattern: *tokenpak-rendering-base
        effort:
          type: string
          pattern: *tokenpak-rendering-base

    SessionEconomicsSession:
      type: object
      additionalProperties: true
      required: [id, identity_state, turns_observed, model]
      properties:
        id:
          type: [string, "null"]
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
        identity_state:
          type: string
          enum: [observed, no_data, unavailable, error]
        turns_observed:
          type: integer
          minimum: 0
        model:
          $ref: "#/components/schemas/SessionEconomicsModel"
        reason:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
      description: >-
        An observed identity carries a non-empty id. Other identity states carry
        null; error also carries a reason.
      allOf:
        - if:
            properties:
              identity_state:
                const: observed
            required: [identity_state]
          then:
            properties:
              id:
                type: string
                minLength: 1
        - if:
            properties:
              identity_state:
                enum: [no_data, unavailable, error]
            required: [identity_state]
          then:
            properties:
              id:
                type: "null"
        - if:
            properties:
              identity_state:
                const: error
            required: [identity_state]
          then:
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1

    SessionEconomicsFacts:
      type: object
      additionalProperties: true
      required: [input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_usd]
      properties:
        input_tokens:
          $ref: "#/components/schemas/SessionEconomicsTokenFactValue"
        output_tokens:
          $ref: "#/components/schemas/SessionEconomicsTokenFactValue"
        cache_read_tokens:
          $ref: "#/components/schemas/SessionEconomicsTokenFactValue"
        cache_write_tokens:
          $ref: "#/components/schemas/SessionEconomicsTokenFactValue"
        cost_usd:
          $ref: "#/components/schemas/SessionEconomicsCostValue"
      description: >-
        Token facts use unit tokens and never use the estimated state. Missing
        measurements are null, not numeric zero.

    SessionEconomicsState:
      type: object
      additionalProperties: true
      required:
        - context_tokens
        - base_tokens
        - context_growth_ewma
        - burn_tokens_per_turn
        - burn_usd_per_turn
        - burn_slope
        - idle_seconds
        - cache_ttl_seconds
        - cache_state
      properties:
        context_tokens:
          $ref: "#/components/schemas/SessionEconomicsTokenValue"
        base_tokens:
          $ref: "#/components/schemas/SessionEconomicsTokenValue"
        context_growth_ewma:
          $ref: "#/components/schemas/SessionEconomicsTokensPerTurnValue"
        burn_tokens_per_turn:
          $ref: "#/components/schemas/SessionEconomicsTokensPerTurnValue"
        burn_usd_per_turn:
          $ref: "#/components/schemas/SessionEconomicsUsdPerTurnValue"
        burn_slope:
          type: string
          enum: [unknown, down, flat, up]
        idle_seconds:
          $ref: "#/components/schemas/SessionEconomicsSecondsValue"
        cache_ttl_seconds:
          $ref: "#/components/schemas/SessionEconomicsSecondsValue"
        cache_state:
          type: string
          enum: [warm, expired, unknown]
      description: >-
        Units are tokens, tokens/turn, usd/turn, or seconds according to the
        enclosing field. Estimated USD burn requires estimated rate-card cost provenance.

    SessionEconomicsRunway:
      type: object
      additionalProperties: true
      required: [status, turns, binding_constraint, guard_state]
      properties:
        status:
          type: string
          enum: [available, learning, unavailable, error]
        turns:
          type: [integer, "null"]
          minimum: 0
        binding_constraint:
          type: string
          enum: [budget, context_soft, context_hard, rolling_cap, unknown]
        guard_state:
          type: string
          enum: [allow, amber, soft_block, hard_stop, unknown]
        reason:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
      description: >-
        available carries non-negative turns and a non-unknown binding constraint.
        Other statuses carry null turns; error also carries a reason.
      allOf:
        - if:
            properties:
              status:
                const: available
            required: [status]
          then:
            properties:
              turns:
                type: integer
                minimum: 0
              binding_constraint:
                enum: [budget, context_soft, context_hard, rolling_cap]
        - if:
            properties:
              status:
                enum: [learning, unavailable, error]
            required: [status]
          then:
            properties:
              turns:
                type: "null"
        - if:
            properties:
              status:
                const: error
            required: [status]
          then:
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1
        - if:
            properties:
              guard_state:
                const: hard_stop
            required: [guard_state]
          then:
            properties:
              turns:
                type: [integer, "null"]
                maximum: 0

    SessionEconomicsInterval:
      type: object
      additionalProperties: true
      required: [state, low, high]
      properties:
        state:
          type: string
          enum: [estimated, no_data, unavailable, error]
        low:
          type: [number, "null"]
          minimum: 0
        high:
          type: [number, "null"]
          minimum: 0
        source:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
        reason:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
        unit:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
      description: >-
        Estimated intervals carry non-negative low and high bounds plus a
        non-whitespace source. Other states carry null bounds; error also
        carries a reason. The runtime enforces low <= high; JSON Schema cannot
        compare sibling numeric properties directly.
      allOf:
        - if:
            properties:
              state:
                const: estimated
            required: [state]
          then:
            required: [source]
            properties:
              low:
                type: number
              high:
                type: number
              source:
                type: string
                minLength: 1
        - if:
            properties:
              state:
                enum: [no_data, unavailable, error]
            required: [state]
          then:
            properties:
              low:
                type: "null"
              high:
                type: "null"
        - if:
            properties:
              state:
                const: error
            required: [state]
          then:
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1

    SessionEconomicsTokenInterval:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsInterval"
        - type: object
          properties:
            unit:
              type: string
              enum: ["", tokens]

    SessionEconomicsUsdInterval:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsInterval"
        - type: object
          properties:
            unit:
              type: string
              enum: ["", usd]

    SessionEconomicsTurnInterval:
      allOf:
        - $ref: "#/components/schemas/SessionEconomicsInterval"
        - type: object
          properties:
            unit:
              type: string
              enum: ["", turns]

    SessionEconomicsCoverage:
      type: object
      additionalProperties: true
      required: [method, observed, history_n, drift_state]
      properties:
        method:
          type: [string, "null"]
          pattern: *tokenpak-rendering-base
        observed:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        history_n:
          type: integer
          minimum: 0
        drift_state:
          type: string
          enum: [stable, drifting, unknown]

    SessionEconomicsForecast:
      type: object
      additionalProperties: true
      required:
        - status
        - remaining_tokens_likely_50
        - remaining_tokens_ceiling_90
        - remaining_cost_usd_likely_50
        - remaining_cost_usd_ceiling_90
        - expected_turns
        - coverage
        - predicted_block_probability
      properties:
        status:
          type: string
          enum: [learning, available, unavailable, error]
        remaining_tokens_likely_50:
          $ref: "#/components/schemas/SessionEconomicsTokenInterval"
        remaining_tokens_ceiling_90:
          $ref: "#/components/schemas/SessionEconomicsTokenValue"
        remaining_cost_usd_likely_50:
          $ref: "#/components/schemas/SessionEconomicsUsdInterval"
        remaining_cost_usd_ceiling_90:
          allOf:
            - $ref: "#/components/schemas/SessionEconomicsNumericValue"
            - type: object
              properties:
                unit:
                  type: string
                  enum: ["", usd]
        expected_turns:
          $ref: "#/components/schemas/SessionEconomicsTurnInterval"
        coverage:
          $ref: "#/components/schemas/SessionEconomicsCoverage"
        predicted_block_probability:
          $ref: "#/components/schemas/SessionEconomicsProbabilityValue"
        reason:
          type: string
          anyOf:
            - maxLength: 0
            - pattern: *tokenpak-rendering-base
      description: >-
        Available carries estimated token and turn ranges. Learning,
        unavailable, and error carry no predictions; error also carries a
        reason. The runtime enforces that each 90-percent ceiling is at least
        its matching likely-50 high bound; JSON Schema cannot compare those
        values across sibling objects directly.
      allOf:
        - if:
            properties:
              status:
                const: available
            required: [status]
          then:
            properties:
              remaining_tokens_likely_50:
                properties:
                  state:
                    const: estimated
              remaining_tokens_ceiling_90:
                properties:
                  state:
                    const: estimated
              expected_turns:
                properties:
                  state:
                    const: estimated
              coverage:
                properties:
                  method:
                    type: string
                    minLength: 1
                  observed:
                    type: number
                    minimum: 0
                    maximum: 1
                  history_n:
                    type: integer
                    minimum: 1
              predicted_block_probability:
                properties:
                  state:
                    enum: [estimated, no_data, unavailable, error]
            oneOf:
              - properties:
                  remaining_cost_usd_likely_50:
                    properties:
                      state:
                        const: estimated
                  remaining_cost_usd_ceiling_90:
                    properties:
                      state:
                        const: estimated
              - properties:
                  remaining_cost_usd_likely_50:
                    properties:
                      state:
                        const: no_data
                  remaining_cost_usd_ceiling_90:
                    properties:
                      state:
                        const: no_data
              - properties:
                  remaining_cost_usd_likely_50:
                    properties:
                      state:
                        const: unavailable
                  remaining_cost_usd_ceiling_90:
                    properties:
                      state:
                        const: unavailable
              - properties:
                  remaining_cost_usd_likely_50:
                    properties:
                      state:
                        const: error
                  remaining_cost_usd_ceiling_90:
                    properties:
                      state:
                        const: error
        - if:
            properties:
              status:
                enum: [learning, unavailable, error]
            required: [status]
          then:
            properties:
              remaining_tokens_likely_50:
                properties:
                  state:
                    enum: [no_data, unavailable, error]
              remaining_tokens_ceiling_90:
                properties:
                  state:
                    enum: [no_data, unavailable, error]
              remaining_cost_usd_likely_50:
                properties:
                  state:
                    enum: [no_data, unavailable, error]
              remaining_cost_usd_ceiling_90:
                properties:
                  state:
                    enum: [no_data, unavailable, error]
              expected_turns:
                properties:
                  state:
                    enum: [no_data, unavailable, error]
              predicted_block_probability:
                properties:
                  state:
                    enum: [no_data, unavailable, error]
        - if:
            properties:
              status:
                const: error
            required: [status]
          then:
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1

    AnthropicMessagesResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        content:
          type: array
          items:
            type: object
        model:
          type: string
        stop_reason:
          type: string
        usage:
          $ref: "#/components/schemas/AnthropicUsage"

    AnthropicUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cache_read_input_tokens:
          type: integer
        cache_creation_input_tokens:
          type: integer

    OpenAIChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          example: gpt-4o
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        stream:
          type: boolean
          default: false
        temperature:
          type: number
        max_tokens:
          type: integer
        top_p:
          type: number

    OpenAIChatResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
        usage:
          type: object

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object

    # ── Health ────────────────────────────────────────────────────────────────

    HealthResponse:
      oneOf:
        - $ref: "#/components/schemas/HealthResponseBasic"
        - $ref: "#/components/schemas/HealthResponseDeep"

    HealthResponseBasic:
      type: object
      additionalProperties: false
      required:
        - status
        - uptime_seconds
        - version
        - pid
        - requests_total
        - requests_errors
        - compression_ratio_avg
        - is_degraded
        - is_shutting_down
        - in_flight_requests
        - memory_guard
        - admission
        - agent_concurrency
        - timestamp
        - connection_pool
        - circuit_breakers
      properties:
        status:
          type: string
          enum: [ok, degraded, shutting_down]
          example: ok
        uptime_seconds:
          type: number
          minimum: 0
        version:
          type: string
        pid:
          type: integer
          minimum: 1
        requests_total:
          type: integer
          minimum: 0
        requests_errors:
          type: integer
          minimum: 0
        compression_ratio_avg:
          type: number
        is_degraded:
          type: boolean
        is_shutting_down:
          type: boolean
        in_flight_requests:
          type: integer
          minimum: 0
        memory_guard:
          type: object
          additionalProperties: true
        admission:
          type: object
          additionalProperties: true
        agent_concurrency:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        connection_pool:
          type: object
          additionalProperties: true
        circuit_breakers:
          type: object
          additionalProperties: true

    HealthResponseDeep:
      type: object
      additionalProperties: false
      required:
        - status
        - uptime_seconds
        - version
        - pid
        - requests_total
        - requests_errors
        - compression_ratio_avg
        - is_degraded
        - is_shutting_down
        - in_flight_requests
        - memory_guard
        - admission
        - agent_concurrency
        - timestamp
        - connection_pool
        - circuit_breakers
        - providers
        - memory
        - disk
      properties:
        status:
          type: string
          enum: [ok, degraded, shutting_down]
          example: ok
        uptime_seconds:
          type: number
          minimum: 0
        version:
          type: string
        pid:
          type: integer
          minimum: 1
        requests_total:
          type: integer
          minimum: 0
        requests_errors:
          type: integer
          minimum: 0
        compression_ratio_avg:
          type: number
        is_degraded:
          type: boolean
        is_shutting_down:
          type: boolean
        in_flight_requests:
          type: integer
          minimum: 0
        memory_guard:
          type: object
          additionalProperties: true
        admission:
          type: object
          additionalProperties: true
        agent_concurrency:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        connection_pool:
          type: object
          additionalProperties: true
        circuit_breakers:
          type: object
          additionalProperties: true
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string
        memory:
          type: object
          additionalProperties: false
          required: [rss_mb, available]
          properties:
            rss_mb:
              type: [number, "null"]
              minimum: 0
            available:
              type: boolean
            reason:
              type: string
        disk:
          type: object
          additionalProperties: false
          required: [available_gb, available]
          properties:
            available_gb:
              type: [number, "null"]
              minimum: 0
            available:
              type: boolean
            reason:
              type: string

