    # ── Errors ────────────────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              example: not_found
            message:
              type: string
              example: No trace found for request_id

  responses:
    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              type: rate_limit_exceeded
              message: "Too many requests. Limit: 600 req/min per IP."

    UpstreamError:
      description: Upstream provider error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Proxy Bearer credential is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Non-localhost access is disabled because no proxy auth token is configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
